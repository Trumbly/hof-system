{% extends "base.html" %}

{% block titel %}Zahlerregel{% endblock %}

{% block inhalt %}
<h1>Zahlerregel <span class="leise">zu Regel #{{ regel.pk }}</span></h1>
<p class="leise">{{ regel.bezeichnung }} · <a href="{% url 'kassenbuch:regel' regel.pk %}">Regel im Kassenbuch</a></p>
<form method="post" class="formular">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Speichern</button>
</form>
{% endblock %}
