{# Datenstand: Zahl der fehlenden Pflichtfelder je Bereich, ohne Namen. #}
<li id="kachel-datenstand"><a class="kachel" href="{% url 'stammdaten:datenstand' %}">
  <strong>Datenstand: {{ summe }} Lücke{{ summe|pluralize:"n" }}</strong>
  {% if bereiche %}
  <span class="kachel-zeilen">{% for b in bereiche %}<span class="kachel-zeile">{{ b.titel }}: <strong>{{ b.luecken }}</strong></span>{% endfor %}</span>
  {% else %}<br><span class="leise">Alle Pflichtfelder gefüllt.</span>{% endif %}
</a></li>
