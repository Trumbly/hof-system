{% load bausteine %}<tr id="schreiben-{{ s.pk }}">
  <td data-titel="Schreiben"><a href="{% url 'dokumente:schreiben' s.pk %}">{{ s.titel_lesbar }}</a>{% if s.einseitige_erklaerung and not s.ist_erledigt %}<br><span class="text-3 klein">Zustellnachweis nötig</span>{% endif %}</td>
  <td data-titel="Versandweg">{{ s.get_versandweg_display }}</td>
  <td data-titel="Status">{% badge s.status %}{% if s.serie %} <a class="klein" href="{% url 'dokumente:serie' s.serie %}">Serie</a>{% endif %}</td>
  <td data-titel="erzeugt" class="eng">{{ s.erzeugt_am|date:"d.m.Y" }}</td>
</tr>
