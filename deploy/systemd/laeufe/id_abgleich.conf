# Lauf id_abgleich (H1.6): täglich um 5:30, nach den Kennzahlen aus Verwaltio.
# Vergleicht die NW-IDs auf der Website (HOF_WEBSITE_URL, HOF_WEBSITE_TOKEN) und in Verwaltio
# mit dem Hof-System; jede fehlende oder abweichende ID wird Abweichung und Arbeitsposten
# „ID-Abweichung“, behobene schließen sich. Nicht eingerichtete Quellen überspringt er.
# scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@id_abgleich.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 05:30:00
