# Lauf bank_abruf (H3.1): täglich um 6 Uhr.
# Ruft die Umsätze von Vivid über Enable Banking ab, prüft die Salden beider Konten (auch
# VR, das der hof-mac vorher zuliefert), meldet ablaufende Bankfreigaben 14 Tage vorher
# und Konten ohne Abruf seit zwei Tagen. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@bank_abruf.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 06:00:00
