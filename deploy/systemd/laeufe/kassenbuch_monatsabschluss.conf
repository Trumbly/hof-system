# Lauf kassenbuch_monatsabschluss (H6.6, Standardablauf 7): am 3. jedes Monats um 7 Uhr.
# Schließt den Vormonat ab (alle Umsätze eingeordnet, Saldo passt zur Bank), sperrt ihn und
# legt die Monatsberichte je Objekt als PDF ab. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@kassenbuch_monatsabschluss.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-03 07:00:00
