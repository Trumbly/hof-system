# Lauf belege_postfach (H6.1, Standardablauf 6): stündlich von 7 bis 21 Uhr.
# Legt die PDF-Anlagen aus dem Rechnungspostfach als Belege ab (mit Dublettenprüfung), je
# neuem Beleg ein Arbeitsposten „Belege zuordnen“. So liegt eine Rechnung am selben Tag in
# der Ablage. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@belege_postfach.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 07..21:05:00
