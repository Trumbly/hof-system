# Lauf kern_selbsttest (Beispiel): jeden Montag um 7 Uhr.
# Legt einen Arbeitsposten „Selbsttest“ an. Steht er montags in der Arbeitsliste, laufen
# Timer, Container und Laufprotokoll. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@kern_selbsttest.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=Mon *-*-* 07:00:00
