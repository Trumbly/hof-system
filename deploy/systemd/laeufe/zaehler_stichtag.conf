# Lauf zaehler_stichtag (H7.2): täglich um 6:20, mit eigener Prüfung.
# Nur im Ablesefenster um den Stichtag (Standard 15.12. bis 15.01., apps/zaehler/
# konfiguration.toml) legt er je Zähler ohne Stand einen Arbeitsposten „Ablesung fehlt“ an
# (höchstens einen je Zähler) und schließt Posten, deren Ablesung vorliegt; sonst tut er
# nichts. Täglich statt nur im Dezember, damit ein geänderter Stichtag ohne neuen Zeitplan
# gilt. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@zaehler_stichtag.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 06:20:00
