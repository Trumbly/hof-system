# Lauf abgleich (H3.5): täglich um 6:45, nach dem Einordnen im Kassenbuch um 6:30.
# Gleicht Zahlungen mit den offenen Sollposten ab; Unsicheres kommt in die Arbeitsliste
# „Zahlungen klären“. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@abgleich.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 06:45:00
