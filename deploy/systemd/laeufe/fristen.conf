# Lauf fristen: täglich um 6:15.
# Macht fällige und überfällige Fristen zu Arbeitsposten „Frist fällig“ (höchstens einer je
# Frist) und schließt Posten erledigter Fristen. Sobald der Tageslauf (Schritt 9) fristen
# mit aufruft, entfällt dieser eigene Zeitplan. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@fristen.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 06:15:00
