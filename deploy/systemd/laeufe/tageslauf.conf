# Lauf tageslauf (Standardablauf 10): täglich um 6 Uhr, nach der Sicherung um 3:30.
# Ruft die angemeldeten Läufe in der Reihenfolge des Bauplans (apps/cockpit/tageslauf.py):
# bank_abruf, kassenbuch_einordnen, soll_monat, (abgleich), (Mahnwesen montags), fristen,
# zaehler_stichtag, verwaltio_kennzahlen, id_abgleich, aufgaben_abgleich, sicherung_pruefen,
# benachrichtigen.
# Bricht ein Teil ab, laufen die übrigen weiter. Er ersetzt die eigenen Zeitpläne dieser
# Läufe. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@tageslauf.timer.d/zeitplan.conf ein und trägt die alten aus.

[Timer]
OnCalendar=*-*-* 06:00:00
