# Lauf verwaltio_kennzahlen (V12): nachts um 3:15, vor der Sicherung um 3:30.
# Holt je Wohneinheit offene Posten, Mahnfälle, Stand der NKA und Fristen aus Verwaltio und
# speichert sie als Kennzahl mit NW-ID und Datum (ohne Namen) für die Kachel „Wohnraum“.
# Ohne VERWALTIO_URL und VERWALTIO_TOKEN endet er mit „nicht eingerichtet“. Der echte Client
# ist offen, bis die API-Dokumentation vorliegt: Timer erst danach einschalten.
# scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@verwaltio_kennzahlen.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 03:15:00
