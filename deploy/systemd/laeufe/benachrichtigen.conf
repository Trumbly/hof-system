# Lauf benachrichtigen: täglich um 7:30, 12:30 und 18:30, nach den Morgenläufen.
# Meldet sich per Mail und ntfy nur, wenn ein Lauf gescheitert ist oder Freigaben warten
# (nur Zähler und Link). Dieselbe Lage höchstens einmal am Tag. scripts/systemd-einrichten.sh
# trägt ihn als /etc/systemd/system/hof-lauf@benachrichtigen.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 07,12,18:30:00
