# Lauf kassenbuch_einordnen (H6.3): täglich um 6:30, nach dem Bankabruf um 6:00.
# Ordnet neue Umsätze nach den Zuordnungsregeln ein; Unklares kommt in die Arbeitsliste
# „Umsätze einordnen“. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@kassenbuch_einordnen.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* 06:30:00
