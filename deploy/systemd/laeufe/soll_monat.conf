# Lauf soll_monat (H3.4): am 1. jedes Monats um 5:30, vor Bankabruf und Abgleich.
# Stellt die Sollposten aller Verträge bis zum Monatsende und gleicht sie mit den
# Konditionen ab. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@soll_monat.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-01 05:30:00
