# Lauf aufgaben_abgleich (N1): alle 30 Minuten, zusätzlich im Tageslauf.
# Bringt die Aufgaben im Hof-Backlog (Notion) auf den Stand der offenen Arbeitsposten
# („3 Mahnungen senden“ mit NW-IDs, Fälligkeit und Link, ohne Namen und Beträge). Ruft
# Notion nur, wenn sich etwas geändert hat. Ohne HOF_NOTION_TOKEN endet er mit „nicht
# eingerichtet“. scripts/systemd-einrichten.sh trägt ihn als
# /etc/systemd/system/hof-lauf@aufgaben_abgleich.timer.d/zeitplan.conf ein.

[Timer]
OnCalendar=*-*-* *:15,45:00
