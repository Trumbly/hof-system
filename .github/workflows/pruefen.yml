name: Prüfen

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: ruff, mypy, pytest
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hof
          POSTGRES_USER: hof
          POSTGRES_PASSWORD: hof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hof -d hof"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://hof:hof@localhost:5432/hof
      HOF_PDF_PFLICHT: "1"  # PDF-Tests laufen hier, statt übersprungen zu werden
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Systembibliotheken für WeasyPrint (PDF-Tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            fontconfig fonts-dejavu-core
      - name: Abhängigkeiten
        run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy (services)
        run: uv run mypy apps/*/services.py
      - name: pytest
        run: uv run pytest
      - name: Testhof aufbauen (migrate, testhof --seed 42, zweimal gleich)
        shell: bash  # mit pipefail: Ein Fehler des Befehls geht nicht im tee verloren
        env:
          DJANGO_SETTINGS_MODULE: hof.settings.test
        run: |
          uv run python manage.py migrate --no-input
          uv run python manage.py testhof --seed 42 | tee erster-lauf.txt
          uv run python manage.py testhof --seed 42 --leeren | tee zweiter-lauf.txt
          erste=$(grep '^Prüfsumme:' erster-lauf.txt)
          zweite=$(grep '^Prüfsumme:' zweiter-lauf.txt)
          test -n "$erste" && test "$erste" = "$zweite"

  e2e:
    name: Oberfläche (Playwright, Smoke-Test)
    runs-on: ubuntu-24.04
    # Vorerst nicht blockierend: Die heutigen Seiten scheitern noch (Review 2, C5:
    # Scrollleiste der Kopfnavigation, englische Dateifelder). Wird blockierend
    # (continue-on-error entfernen), sobald R2-5 (Grundgerüst) gemergt ist.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hof
          POSTGRES_USER: hof
          POSTGRES_PASSWORD: hof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hof -d hof"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Eigene Datenbank für den Server der Oberflächentests (tests/e2e/server.py)
      HOF_E2E_DATABASE_URL: postgres://hof:hof@localhost:5432/hof_e2e
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Systembibliotheken für WeasyPrint (Schreiben und Verträge als PDF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            fontconfig fonts-dejavu-core
      - name: Abhängigkeiten
        run: uv sync --locked
      - name: Chromium für Playwright
        run: uv run playwright install --with-deps chromium
      - name: Smoke-Test (15 Seiten bei 1440 und 390 px)
        run: uv run pytest -m "e2e and not klickmessung" tests/e2e
      - name: Screenshots und Server-Log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/artefakte/smoke/
            tests/e2e/artefakte/server.log
          if-no-files-found: warn
          retention-days: 14

  betrieb:
    name: Skripte, Compose, Produktions-Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck (scripts/*.sh)
        run: |
          command -v shellcheck || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          shellcheck scripts/*.sh
      - name: docker-compose.prod.yml gültig
        env:
          HOF_VERSION: pipeline
          HOF_TAILSCALE_IP: 100.64.0.1
          HOF_HOSTNAME: hof-system.beispiel.ts.net
          HOF_ENV_DATEI: /dev/null
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Produktions-Image bauen
        run: docker build --build-arg HOF_VERSION=pipeline -t hof-system:pipeline .
      - name: Image prüfen (nicht root, keine Entwicklungswerkzeuge, check --deploy)
        run: |
          test "$(docker run --rm hof-system:pipeline id -u)" != "0"
          if docker run --rm hof-system:pipeline python -c "import pytest" 2>/dev/null; then
            echo "pytest im Produktions-Image gefunden" >&2
            exit 1
          fi
          docker run --rm \
            -e DJANGO_SECRET_KEY=nur-fuer-die-pipeline-kein-geheimnis-0123456789abcdefghijklmnop \
            -e DATABASE_URL=postgres://pipeline@localhost:5432/pipeline \
            -e EMAIL_URL=consolemail:// \
            -e DJANGO_ALLOWED_HOSTS=hof-system.beispiel.ts.net \
            hof-system:pipeline python manage.py check --deploy --fail-level ERROR
          # Status-MCP (Schritt 11): startet ohne Django und ohne Einrichtung mit „nicht
          # eingerichtet“ statt mit einem Importfehler.
          docker run --rm hof-system:pipeline python -c \
            "from apps.statusmcp.__main__ import app_aus_umgebung; app_aus_umgebung()"

  datenschutz:
    name: Keine Daten, keine Geheimnisse
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: pre-commit (Datenprüfung und Dateiprüfungen)
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks,ruff-check,ruff-format
      - name: gitleaks über den ganzen Verlauf
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
