# Entwicklungsumgebung: Postgres 16 und Mailpit. Nur Testdaten, nie Echtdaten.
name: hof-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hof
      POSTGRES_USER: hof
      POSTGRES_PASSWORD: hof
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hof-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hof -d hof"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Oberfläche: http://localhost:8025

volumes:
  hof-dev-db:
